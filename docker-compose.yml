# yaml 配置
version: '3'
networks:
  nginx:
    external: false
services:
  jupyter:
    build: ./jupyter
    image: ouczbs:jupyter
    container_name: jupyter
    restart: always
    networks:
      - nginx
    ports:
      - "8888:8888"
    environment:
      - XDG_CONFIG_HOME=/data/anki
    volumes:
      - /root/docker:/data/jupyter
      - /data/anki:/data/anki
  anki:
    build: ./anki
    image: ouczbs:anki
    container_name: anki
    restart: always
    ports:
      - "27701:27001"
    networks:
      - nginx
    volumes:
      - /data/anki:/data/anki
      - /root/docker/anki/anki-sync-server:/app/anki/anki-sync-server
  nginx:
    image: nginx
    container_name: nginx
    restart: always
    networks:
      - nginx
    ports:
      # - 443:443
      # - 80:80
      - 27443:27443
      - 27001:27001
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/html:/usr/share/nginx/html
      #- ./nginx:/usr/share/nginx/html
      # - /root/docker/nginx/logs:/var/log/nginx
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=db:3306
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=ouczbs
      - GITEA__database__PASSWD=ouczbs
    restart: always
    networks:
      - nginx
    volumes:
      - /root/.ssh:/root/.ssh
      - /data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      - db
  db:
    image: mysql:8
    restart: always
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=ouczbs
      - MYSQL_USER=ouczbs
      - MYSQL_PASSWORD=ouczbs
      - MYSQL_DATABASE=gitea
    networks:
      - nginx
    volumes:
      - /data/mysql:/var/lib/mysql
